<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Channel Reel — YouTube video list</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>

    <header class="site-header">
      <p class="brand">Channel Reel</p>
      <p class="tagline">채널 ID를 넣으면 업로드 영상 목록을 보여줍니다.</p>
    </header>

    <main class="shell">
      <form id="search-form" class="search-form" autocomplete="off">
        <label class="field-label" for="api-key">YouTube API 키</label>
        <input
          id="api-key"
          name="apiKey"
          type="password"
          spellcheck="false"
          placeholder="Google Cloud에서 발급한 API 키"
          required
        />

        <label class="field-label" for="channel-id">YouTube 채널 ID</label>
        <div class="field-row">
          <input
            id="channel-id"
            name="channelId"
            type="text"
            inputmode="text"
            spellcheck="false"
            placeholder="예: UC_x5XG1OV2P6uZZ5FSM9Ttw"
            required
          />
          <button type="submit" id="submit-btn">영상 불러오기</button>
        </div>
        <p class="hint">
          서버·npm·파이썬 없이 <code>index.html</code>만 열면 됩니다. 브라우저가 YouTube
          Data API v3를 직접 호출합니다. 채널은 <code>UC…</code> ID를 쓰세요 (@핸들 아님).
          API 키는 코드에 넣지 말고 이 입력란에만 사용하세요.
        </p>
      </form>

      <section id="status" class="status" hidden role="status" aria-live="polite"></section>

      <section id="channel-meta" class="channel-meta" hidden></section>

      <section id="results" class="results" hidden>
        <div class="results-head">
          <h2 id="results-title">Videos</h2>
          <p id="results-count" class="results-count"></p>
        </div>
        <ul id="video-list" class="video-list"></ul>
        <div id="pager" class="pager" hidden>
          <button type="button" id="prev-page" class="ghost-btn">이전</button>
          <button type="button" id="next-page" class="ghost-btn">다음</button>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <p>
        HTML + JavaScript only (서버 없음) · YouTube Data API v3 · README 참고
      </p>
    </footer>

    <!-- type=module 없이 로드: file:// 로 열어도 동작 -->
    <script src="./app.js" defer></script>
  </body>
</html>
